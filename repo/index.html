<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>快速笔记</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
</head>
<body>
<div id="login-screen">
  <form id="login-form">
    <h1>QuickNote</h1>
    <p class="login-description">输入你的 GitHub 个人访问令牌</p>
    <input id="login-token" type="password" placeholder="ghp_xxx..." autocomplete="off" required>
    <div class="token-hint">
      令牌需要 <code>gist</code> 权限。
      <a href="https://github.com/settings/tokens/new?scopes=gist&description=QuickNote" target="_blank" rel="noopener noreferrer" class="token-link">创建令牌</a>
    </div>
    <button type="submit">登录</button>
    <p id="login-error"></p>
  </form>
</div>
<div id="app" class="app-hidden">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>QuickNote</h1>
      <button id="new-note-btn" title="新建笔记"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="搜索笔记...">
    </div>
    <div class="tag-filter" id="tag-filter"></div>
    <div class="note-list" id="note-list"></div>
    <div class="sidebar-footer">
      <span class="note-count" id="note-count"></span>
      <button id="logout-btn">退出登录</button>
    </div>
  </aside>
  <main id="editor-area">
    <div class="mobile-topbar" id="mobile-topbar" style="display:none">
      <button class="back-btn" id="mobile-back-btn" title="返回列表"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="topbar-title" id="mobile-topbar-title"></span>
      <div class="topbar-actions">
        <button id="mobile-preview-btn" title="预览" class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="mobile-delete-btn" title="删除" class="icon-btn danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
    </div>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">&#x1f4dd;</div>
      <h2>欢迎使用快速笔记</h2>
      <p>数据通过 GitHub Gist 同步</p>
      <p class="shortcut-hint"><kbd>Ctrl</kbd>+<kbd>N</kbd> 新建 | <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</p>
    </div>
    <div id="editor-view" style="display:none">
      <div class="editor-toolbar">
        <input type="text" id="note-title" placeholder="笔记标题...">
        <div class="toolbar-actions">
          <div class="tag-input-wrapper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <input type="text" id="tag-input" placeholder="添加标签，回车确认">
          </div>
          <button id="preview-btn" title="预览" class="icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="delete-btn" title="删除" class="icon-btn danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="tag-bar" id="tag-bar"></div>
      <textarea id="note-content" placeholder="开始写作... 支持 Markdown"></textarea>
      <div id="preview-content" class="preview-content" style="display:none"></div>
      <div class="editor-footer">
        <span id="char-count"></span>
        <span id="last-saved"></span>
      </div>
    </div>
  </main>
</div>
<div id="sync-status" style="display:none;position:fixed;bottom:16px;right:16px;background:var(--sidebar-bg);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:999"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16.4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
