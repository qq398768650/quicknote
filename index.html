<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>快速笔记</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
</head>
<body>
<div id="login-screen">
  <form id="login-form">
    <h1>QuickNote</h1>
    <p class="login-description">输入你的 GitHub 个人访问令牌</p>
    <input id="login-token" type="password" placeholder="ghp_xxx..." autocomplete="off" required>
    <div class="token-hint">
      令牌需要 <code>gist</code> 权限。
      <a href="https://github.com/settings/tokens/new?scopes=gist&description=QuickNote" target="_blank" rel="noopener noreferrer" class="token-link">创建令牌</a>
    </div>
    <button type="submit">登录</button>
    <p id="login-error"></p>
  </form>
</div>
<div id="app" class="app-hidden">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>QuickNote</h1>
      <button id="new-note-btn" title="新建笔记"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="搜索笔记...">
    </div>
    <div class="tag-filter" id="tag-filter"></div>
    <div class="note-list" id="note-list"></div>
    <div class="sidebar-footer">
      <span class="note-count" id="note-count"></span>
      <div class="footer-actions">
        <button type="button" id="settings-btn" title="附件设置" class="icon-btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button type="button" id="logout-btn">退出登录</button>
      </div>
    </div>
  </aside>
  <main id="editor-area">
    <div class="mobile-topbar" id="mobile-topbar" style="display:none">
      <button class="back-btn" id="mobile-back-btn" title="返回列表"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="topbar-title" id="mobile-topbar-title"></span>
      <div class="topbar-actions">
        <button id="mobile-preview-btn" title="预览" class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button id="mobile-delete-btn" title="删除" class="icon-btn danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
    </div>
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">&#x1f4dd;</div>
      <h2>欢迎使用快速笔记</h2>
      <p>数据通过 GitHub Gist 同步</p>
      <p class="shortcut-hint"><kbd>Ctrl</kbd>+<kbd>N</kbd> 新建 | <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</p>
    </div>
    <div id="editor-view" style="display:none">
      <div class="editor-toolbar">
        <input type="text" id="note-title" placeholder="笔记标题...">
        <div class="toolbar-actions">
          <div class="tag-input-wrapper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <input type="text" id="tag-input" placeholder="添加标签，回车确认">
          </div>
          <button id="preview-btn" title="预览" class="icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="attach-btn" title="添加附件" class="icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" multiple class="hidden-input">
          <button id="delete-btn" title="删除" class="icon-btn danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="tag-bar" id="tag-bar"></div>
      <div class="attachment-bar" id="attachment-bar"></div>
      <textarea id="note-content" placeholder="开始写作... 支持 Markdown"></textarea>
      <div id="preview-content" class="preview-content" style="display:none"></div>
      <div class="editor-footer">
        <span id="char-count"></span>
        <span id="last-saved"></span>
      </div>
    </div>
  </main>
</div>
<div id="sync-status" class="sync-status"></div>
<div id="settings-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>附件存储设置</h3>
    <p class="modal-desc">指定一个 GitHub Repo 用于存放附件（格式：owner/repo）</p>
    <input type="text" id="attach-repo-input" placeholder="例如：username/quicknote-files">
    <p class="modal-hint">注意：需要令牌具有 <code>repo</code> 权限。<a href="https://github.com/settings/tokens/new?scopes=repo&description=QuickNote-Attachments" target="_blank" rel="noopener noreferrer">创建新令牌</a></p>
    <div class="modal-actions">
      <button type="button" id="settings-cancel" class="btn-secondary">取消</button>
      <button type="button" id="settings-save" class="btn-primary">保存</button>
    </div>
  </div>
</div>
<div id="image-preview-modal" class="modal-overlay" style="display:none">
  <div class="image-preview-box">
    <button id="image-preview-close" class="image-preview-close">&times;</button>
    <img id="image-preview-img" src="" alt="">
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16.4"></script>
<script src="app.js?v=5"></script>
</body>
</html>
